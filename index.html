<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #ffccdc;
            color: #ff4081;
            transition: all 0.5s ease;
            overflow: hidden;
            position: relative;
        }
        .container {
            margin-top: 20vh;
        }
        .button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #ff1c68;
        }
        .hidden {
            display: none !important;
        }
        .valentine-text {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 4px 4px 6px rgba(255, 64, 129, 0.6);
            color: #ff0033;
        }
        .hearts {
            position: absolute;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            top: 0;
            left: 0;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            clip-path: polygon(50% 0%, 100% 30%, 80% 100%, 50% 80%, 20% 100%, 0% 30%);
            opacity: 0.7;
            animation: float 5s infinite ease-in-out;
        }
        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    <div class="container page" id="mainPage">
        <h1 class="valentine-text">Will you be my Valentine? 💕</h1>
        <button class="button btn btn-lg" onclick="showPage('yesPage')">Yes</button>
        <button class="button btn btn-lg" onclick="showPage('noPage')">No</button>
    </div>

    <div class="container page hidden" id="yesPage">
        <h1 class="valentine-text">YAY! I LOVE YOU! 💖</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <div class="container page hidden" id="noPage">
        <h1 class="valentine-text">You have no choice, I LOVE YOU ANYWAY! 😘</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.getElementById('heartsContainer').appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 200);

        function showPage(pageId) {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('yesPage').classList.add('hidden');
            document.getElementById('noPage').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }
    </script>
</body>
</html>
