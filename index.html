<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #ffccdc;
            color: #ff4081;
            transition: all 0.5s ease;
            overflow: hidden;
            position: relative;
        }
        .container {
            margin-top: 20vh;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
        }
        .button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #ff1c68;
            transform: scale(1.1) rotate(3deg);
        }
        .hidden {
            display: none;
        }
        .valentine-text {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.8), 0 0 20px rgba(255, 64, 129, 0.5);
            color: #ff0033;
            animation: sparkle 1.5s infinite alternate;
        }
        @keyframes sparkle {
            0% { text-shadow: 0 0 10px rgba(255, 64, 129, 0.8), 0 0 20px rgba(255, 64, 129, 0.5); }
            100% { text-shadow: 0 0 15px rgba(255, 64, 129, 1), 0 0 25px rgba(255, 64, 129, 0.7); }
        }
        .heart-trail {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: red;
            clip-path: polygon(50% 0%, 100% 30%, 80% 100%, 50% 80%, 20% 100%, 0% 30%);
            opacity: 0.8;
            pointer-events: none;
            animation: fadeOut 1s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>
<body>
    <div class="toggle-container">
        <button class="button btn btn-sm" onclick="toggleNightMode()">🌙 Toggle Night Mode</button>
    </div>
    <div class="hearts" id="heartsContainer"></div>
    <div class="stars" id="starsContainer"></div>
    <div class="container page" id="mainPage">
        <h1 class="valentine-text">Will you be my Valentine? 💕</h1>
        <button class="button btn btn-lg" onclick="showPage('yesPage'); triggerConfetti()">Yes</button>
        <button class="button btn btn-lg" onclick="showPage('noPage')">No</button>
    </div>

    <div class="container page hidden" id="yesPage">
        <h1 class="valentine-text">YAY! I LOVE YOU! 💖</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <div class="container page hidden" id="noPage">
        <h1 class="valentine-text">You have no choice, I LOVE YOU ANYWAY! 😘</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function triggerConfetti() {
            for (let i = 0; i < 300; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = Math.random() * 50 + 'px';
                confetti.style.backgroundColor = ["pink", "red", "hotpink", "white"][Math.floor(Math.random() * 4)];
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        document.addEventListener("mousemove", function(e) {
            const heart = document.createElement("div");
            heart.classList.add("heart-trail");
            heart.style.left = `${e.clientX}px`;
            heart.style.top = `${e.clientY}px`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        });
    </script>
</body>
</html>
