<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine? 💖</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background-color: #ffccdc;
      color: #ff4081;
      transition: all 0.5s ease;
      overflow: hidden;
      position: relative;
    }
    .container {
      margin-top: 20vh;
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 15px;
    }
    .button {
      background-color: #ff4081;
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      margin: 10px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }
    .button:hover {
      background-color: #ff1c68;
      transform: scale(1.1) rotate(3deg);
    }
    .hidden {
      display: none;
    }
    .valentine-text {
      font-size: 50px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 64, 129, 0.8), 0 0 20px rgba(255, 64, 129, 0.5);
      color: #ff0033;
      animation: sparkle 1.5s infinite alternate;
    }
    @keyframes sparkle {
      0% {
        text-shadow: 0 0 10px rgba(255, 64, 129, 0.8), 0 0 20px rgba(255, 64, 129, 0.5);
      }
      100% {
        text-shadow: 0 0 15px rgba(255, 64, 129, 1), 0 0 25px rgba(255, 64, 129, 0.7);
      }
    }
    .hearts {
      position: absolute;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    /* Removed heart-trail CSS */

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      clip-path: polygon(50% 0%, 100% 30%, 80% 100%, 50% 80%, 20% 100%, 0% 30%);
      opacity: 0.7;
      animation: float 5s infinite ease-in-out;
    }
    @keyframes float {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
    .night-mode {
      background-color: #1a1a2e !important;
      color: #ffccdc !important;
    }
    .night-mode .stars {
      display: block;
    }
    .toggle-container {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .stars {
      display: none;
      position: fixed;
      width: 100%;
      height: 100vh;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: white;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0.8;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle {
      0% {
        opacity: 0.3;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="toggle-container">
    <button class="button btn btn-sm" onclick="toggleNightMode()">🌙Night Mode</button>
  </div>
  <div class="hearts" id="heartsContainer"></div>
  <div class="stars" id="starsContainer"></div>
  <div class="container page" id="mainPage">
    <h1 class="valentine-text">Will you be my Valentine? 💕</h1>
    <button class="button btn btn-lg" onclick="showPage('yesPage'); triggerConfetti()">Yes</button>
    <button class="button btn btn-lg" onclick="showPage('noPage')">No</button>
  </div>

  <div class="container page hidden" id="yesPage">
    <h1 class="valentine-text">YAY! I LOVE YOU! 💖</h1>
    <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
  </div>

  <div class="container page hidden" id="noPage">
    <h1 class="valentine-text">You have no choice, I LOVE YOU ANYWAY! 😘</h1>
    <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      document.getElementById('heartsContainer').appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 200);

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    // Removed the mousemove event listener that created the heart cursor

    function toggleNightMode() {
      document.body.classList.toggle('night-mode');
      if (document.body.classList.contains('night-mode')) {
        generateStars();
      } else {
        document.getElementById('starsContainer').innerHTML = '';
      }
    }

    function generateStars() {
      const starContainer = document.getElementById('starsContainer');
      starContainer.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDuration = Math.random() * 2 + 1 + 's';
        starContainer.appendChild(star);
      }
    }
  </script>
</body>
</html>
