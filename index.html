<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: url('https://i.imgur.com/lYpT5b8.jpg') no-repeat center center/cover;
            color: #ff4081;
            transition: all 0.5s ease;
            overflow: hidden;
            position: relative;
        }
        .container {
            margin-top: 20vh;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
        }
        .button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #ff1c68;
        }
        .hidden {
            display: none;
        }
        .valentine-text {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 4px 4px 6px rgba(255, 64, 129, 0.6);
            color: #ff0033;
        }
    </style>
</head>
<body>
    <div class="container page" id="mainPage">
        <h1 class="valentine-text">Will you be my Valentine? 💕</h1>
        <button class="button btn btn-lg" onclick="showPage('yesPage')">Yes</button>
        <button class="button btn btn-lg" onclick="showPage('noPage')">No</button>
    </div>

    <div class="container page hidden" id="yesPage">
        <h1 class="valentine-text">YAY! I LOVE YOU! 💖</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <div class="container page hidden" id="noPage">
        <h1 class="valentine-text">You have no choice, I LOVE YOU ANYWAY! 😘</h1>
        <button class="button btn btn-lg" onclick="showPage('mainPage')">Go Back</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }
    </script>
</body>
</html>
