<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise 💖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-color: #ffccdc;
            color: #ff4081;
            transition: all 0.5s ease;
            background-image: url('https://i.imgur.com/lYpT5b8.jpg'); /* Replace with a heart-patterned background */
            background-size: cover;
        }
        .container {
            margin-top: 20vh;
        }
        .button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #ff1c68;
        }
        .hidden {
            display: none;
        }
        img {
            width: 250px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(255, 64, 129, 0.5);
        }
        .cute-text {
            font-size: 60px;
            font-weight: bold;
            text-shadow: 4px 4px 6px rgba(255, 64, 129, 0.6);
            color: #ff0033;
        }
    </style>
</head>
<body>
    <div class="container" id="page1">
        <h1 class="cute-text">Hello Baby &lt;3</h1>
        <button class="button btn btn-lg" onclick="nextPage()">Next</button>
    </div>

    <div class="container hidden" id="page2">
        <h1>Will you be my Valentine? 💕</h1>
        <button class="button btn btn-lg" onclick="yesAnswer()">Yes</button>
        <button class="button btn btn-lg" onclick="noAnswer()">No</button>
    </div>

    <div class="container hidden" id="yesPage">
        <h1>I LOVE YOU SO MUCH!! 😘💖</h1>
        <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="hug">
    </div>

    <div class="container hidden" id="noPage">
        <h1>😢 Are you sure? Pretty please?</h1>
        <img src="https://i.imgur.com/b1W2vlC.jpg" alt="sad puppy">
        <button class="button btn btn-lg" onclick="backToAsk()">Okay...</button>
    </div>

    <script>
        function nextPage() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }
        function yesAnswer() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('yesPage').classList.remove('hidden');
        }
        function noAnswer() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('noPage').classList.remove('hidden');
        }
        function backToAsk() {
            document.getElementById('noPage').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }
    </script>
</body>
</html>
